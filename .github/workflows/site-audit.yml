name: Inspect Six Faced World site
on:
  push:
    paths:
      - .github/workflows/site-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check public site response
        env:
          SITE_URL: https://six-faced-world-chronicle-7m3r.majorgrove259.chatgpt.site/
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error --max-time 60 --dump-header /tmp/headers.txt "$SITE_URL" -o /tmp/site.html
          echo "=== HTTP response headers ==="
          head -40 /tmp/headers.txt
          echo "=== Byte size ==="
          wc -c /tmp/site.html
          echo "=== Page heading, scripts, styles, and links ==="
          python3 - <<'PY'
          from html.parser import HTMLParser
          class Inspect(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  if tag in ("script","link","img","title","base"):
                      print(tag, dict(attrs))
          Inspect().feed(open("/tmp/site.html",encoding="utf-8",errors="replace").read())
          PY
          echo "=== First 1200 HTML characters ==="
          head -c 1200 /tmp/site.html
          echo
