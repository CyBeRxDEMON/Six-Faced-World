name: Mirror Six Faced World to GitHub Pages

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mirror-site.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  mirror-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4
      - name: Prepare site from source saved in GitHub
        run: |
          set -euo pipefail
          test -s site/index.html || { echo "Site source missing from repository"; exit 1; }
          mkdir -p public
          rsync -a --delete site/ public/
          echo "Using the complete saved website source, no external download required."
          find public -maxdepth 2 -type f | head -45
      - name: Preserve recovered website in GitHub repository
        run: |
          set -euo pipefail
          mkdir -p site
          rsync -a --delete public/ site/
          # Keep the published website at the repository root too, for branch-based Pages.
          rsync -a public/ ./
          git add -A -- . ':(exclude)public'
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Sync Six Faced World website from public site"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
